<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deutsch Rettung B1</title>
<style>
:root{
  --bg:#f6f4ef;--card:#fff;--ink:#1d2330;--mute:#667085;--line:#e4e0d6;
  --acc:#2f5bea;--acc-ink:#fff;--ok:#16794c;--okbg:#e3f4ea;--bad:#b42318;--badbg:#fdeae8;--warn:#b54708;--warnbg:#fff3e0;
  --chip:#eceae2;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#14161c;--card:#1d2028;--ink:#eceef4;--mute:#9aa2b4;--line:#2b2f3a;
    --acc:#6b8cff;--acc-ink:#0d1020;--ok:#5fd39b;--okbg:#14291f;--bad:#ff8a80;--badbg:#321816;--warn:#ffb86b;--warnbg:#33260f;--chip:#2a2e39;
  }
}
:root[data-theme=dark]{
  --bg:#14161c;--card:#1d2028;--ink:#eceef4;--mute:#9aa2b4;--line:#2b2f3a;
  --acc:#6b8cff;--acc-ink:#0d1020;--ok:#5fd39b;--okbg:#14291f;--bad:#ff8a80;--badbg:#321816;--warn:#ffb86b;--warnbg:#33260f;--chip:#2a2e39;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 80px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:-.02em;font-size:18px;margin-right:auto}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:transparent;border:0;color:var(--mute);font:inherit;font-size:14px;font-weight:600;padding:6px 10px;border-radius:8px;cursor:pointer}
nav button.on{background:var(--chip);color:var(--ink)}
h1{font-size:26px;letter-spacing:-.02em;margin:22px 0 4px}
h2{font-size:18px;margin:26px 0 10px}
p.lead{color:var(--mute);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px;line-height:1.2}
.stat span{color:var(--mute);font-size:12px}
button.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;background:var(--acc);color:var(--acc-ink)}
button.btn.sec{background:var(--chip);color:var(--ink)}
button.btn.sm{padding:6px 10px;font-size:13px}
button.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.mode{display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;color:inherit;font:inherit}
.mode:hover{border-color:var(--acc)}
.mode b{font-size:16px}.mode span{color:var(--mute);font-size:13px}
.bar{height:8px;background:var(--chip);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tr{display:grid;grid-template-columns:1fr;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.tr:first-child{border-top:0}
.tr .h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tr .h b{margin-right:auto}
.chip{display:inline-block;background:var(--chip);border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600;color:var(--mute)}
.chip.hot{background:var(--warnbg);color:var(--warn)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
.filters button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
.filters button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.err{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
.err .meta{font-size:12px;color:var(--mute);margin-bottom:6px}
.wrong{background:var(--badbg);color:var(--bad);border-radius:8px;padding:6px 10px;margin:6px 0}
.right{background:var(--okbg);color:var(--ok);border-radius:8px;padding:6px 10px;margin:6px 0}
.why{color:var(--ink);margin:8px 0 0}
.q{font-size:20px;line-height:1.45;margin:10px 0 14px}
.blank{display:inline-block;min-width:64px;border-bottom:2px solid var(--acc);text-align:center;color:var(--acc);font-weight:700}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.opt:hover{border-color:var(--acc)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt[disabled]{cursor:default}
input.txt{width:100%;font:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.uml{display:flex;gap:6px;margin:8px 0}
.uml button{font:inherit;font-weight:700;width:42px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:8px;border-radius:12px}
.tiles.ans{border:2px dashed var(--line);min-height:62px}
.tile{font:inherit;font-size:17px;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
.tile:hover{border-color:var(--acc)}
.tile.lock{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);cursor:default}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.fb .why{color:var(--ink)}
.fb .rule{margin-top:8px;font-size:14px;color:var(--ink)}
.top2{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;font-size:13px;color:var(--mute)}
.rulebox{background:var(--warnbg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;margin:10px 0}
.rulebox i{font-style:normal;font-weight:700;color:var(--acc)}
.flip{min-height:170px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer}
table.rt{border-collapse:collapse;font-size:14px;margin:6px 0}
table.rt td,table.rt th{border:1px solid var(--line);padding:3px 8px}
.score{font-size:54px;font-weight:800;letter-spacing:-.03em;line-height:1}
@media (max-width:520px){.q{font-size:18px}.stats{gap:6px}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="logo">Deutsch Rettung B1</div>
  <nav id="nav"></nav>
</div></header>
<main class="wrap" id="app"></main>

<script src="data.js"></script>
<script>
/* ============ ESTADO ============ */
const KEY='deutsch-rettung-b1-v1';
let S={it:{},best:{},sims:[],rev:{},xp:0,streak:0,last:'',ans:0,okc:0,theme:''};
try{const r=JSON.parse(localStorage.getItem(KEY));if(r)S=Object.assign(S,r)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const today=()=>new Date().toISOString().slice(0,10);
function touchDay(){
  const t=today();
  if(S.last===t)return;
  const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  S.streak=S.last===y?S.streak+1:1;S.last=t;
}
function rec(id,ok){
  const r=S.it[id]||(S.it[id]={box:0,seen:0,wrong:0});
  r.seen++;S.ans++;
  if(ok){r.box=Math.min(5,(r.box||0)+1);S.okc++;S.xp+=10}else{r.wrong++;r.box=1}
  touchDay();save();
}
const mastery=ids=>{let s=0;ids.forEach(id=>{s+=(S.it[id]?.box||0)});return ids.length?s/(5*ids.length):0};
const idsOf=t=>ITEMS.filter(i=>i.topic===t).map(i=>i.id);

/* ============ UTILIDADES ============ */
const $=s=>document.querySelector(s);
const app=$('#app');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.toLowerCase().replace(/\s+/g,' ').replace(/[.!?]+$/,'').trim();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function pickWeighted(pool,n){
  const w=it=>{const b=S.it[it.id]?.box||0;return (b===0?(it.hot?6:3):[0,8,5,3,2,1][b])*Math.random()};
  return pool.map(it=>[w(it),it]).sort((a,b)=>b[0]-a[0]).slice(0,n).map(x=>x[1]);
}
const clone=it=>{const {_o,_tiles,_ans,_lock,_done,_retry,...rest}=it;return rest};
const STARTW=new Set(['ich','sie','er','es','wir','du','der','die','das','mein','meine','an','derzeit']);
const keyOf=s=>s.split(' ').map(w=>w.replace(/[.,?!]+$/,'').toLowerCase()).join(' ');

/* ============ NAVEGACIÓN ============ */
const NAV=[['home','Inicio'],['errors','Fehlerheft'],['practice','Practicar'],['sim','Simulacro'],['prog','Progreso']];
function renderNav(cur){
  $('#nav').innerHTML=NAV.map(([k,l])=>`<button class="${k===cur?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
}
let SS=null,timerId=null;
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function go(v,arg){
  stopTimer();SS=null;window.scrollTo(0,0);
  renderNav(v);
  ({home,errors,practice,sim,prog})[v](arg);
}

/* ============ INICIO ============ */
function home(){
  const acc=S.ans?Math.round(100*S.okc/S.ans):0;
  const weak=TOPICS.map(t=>[t,mastery(idsOf(t))]).sort((a,b)=>a[1]-b[1]).slice(0,2);
  app.innerHTML=`
  <h1>Recupera tu examen de alemán</h1>
  <p class="lead">${ITEMS.length} ejercicios en ${TOPICS.length} temas, todos de tus exámenes: lo que fallaste y lo que ya dominas para mantenerlo.</p>
  <div class="stats">
    <div class="stat"><b>${S.xp}</b><span>puntos XP</span></div>
    <div class="stat"><b>${S.streak}</b><span>días seguidos</span></div>
    <div class="stat"><b>${acc}%</b><span>aciertos (${S.ans})</span></div>
  </div>
  <h2>Empieza por aquí</h2>
  <div class="grid">
    <button class="mode" onclick="start('smart')"><b>🧠 Repaso inteligente</b><span>10 ejercicios. Prioriza lo que fallaste y lo que aún no dominas.</span></button>
    <button class="mode" onclick="start('spot')"><b>🔎 Caza el error</b><span>Elige la frase correcta. Las trampas son tus propios errores.</span></button>
    <button class="mode" onclick="start('timer')"><b>⏱️ Contrarreloj</b><span>90 segundos. Cada fallo resta 5 s. Mejor: ${S.best.timer||0}.</span></button>
    <button class="mode" onclick="go('sim')"><b>📝 Simulacro</b><span>${TOPICS.length*2} ejercicios sin pistas, con nota por tema.</span></button>
    <button class="mode" onclick="go('errors')"><b>📕 Fehlerheft</b><span>Cada error del examen: qué pusiste, la corrección y el porqué.</span></button>
    <button class="mode" onclick="go('practice')"><b>🎯 Practicar un tema</b><span>Spickzettel + ejercicios + tarjetas.</span></button>
  </div>
  <h2>Prioridad ahora</h2>
  <div class="card">
    ${weak.map(([t,m])=>`<div class="tr"><div class="h"><b>${T[t].e} ${T[t].n}</b><span class="chip">${Math.round(m*100)}% dominado</span><button class="btn sm" onclick="start('topic','${t}')">Practicar</button></div><div class="bar"><i style="width:${Math.round(m*100)}%"></i></div></div>`).join('')}
  </div>`;
}

/* ============ FEHLERHEFT ============ */
let ERRF='all';
function errors(){
  const list=ERR.map((e,i)=>({...e,i})).filter(e=>ERRF==='all'||e.topic===ERRF||e.t===ERRF);
  const revd=Object.keys(S.rev).length;
  app.innerHTML=`
  <h1>Fehlerheft</h1>
  <p class="lead">Tus errores reales de los 4 exámenes. ${revd}/${ERR.length} marcados como entendidos.</p>
  <div class="filters">
    ${[['all','Todos'],...TOPICS.map(t=>[t,T[t].n])].map(([k,l])=>`<button class="${ERRF===k?'on':''}" onclick="ERRF='${k}';errors()">${l}</button>`).join('')}
  </div>
  ${list.map(e=>`
  <div class="err">
    <div class="meta">${e.t} · ${e.s} · <span class="chip">${T[e.topic].n}</span>${e.maybe?' <span class="chip hot">lectura no segura</span>':''}</div>
    <div class="wrong">✗ ${esc(e.my)}</div>
    <div class="right">✓ ${esc(e.ok)}</div>
    <div class="why"><b>Por qué:</b> ${e.why}</div>
    <div class="row" style="margin-top:10px">
      <button class="btn sm" onclick="start('topic','${e.topic}')">Practicar este tema</button>
      <button class="btn sm sec" onclick="S.rev[${e.i}]=!S.rev[${e.i}];if(!S.rev[${e.i}])delete S.rev[${e.i}];save();errors()">${S.rev[e.i]?'✅ Entendido':'Marcar entendido'}</button>
    </div>
  </div>`).join('')||'<p>Nada con este filtro.</p>'}`;
}

/* ============ PRACTICAR ============ */
function practice(t){
  if(!t){
    const card=k=>{const m=Math.round(mastery(idsOf(k))*100);return `<button class="mode" onclick="practice('${k}')"><b>${T[k].e} ${T[k].n}</b><span>${T[k].d}</span><div class="bar"><i style="width:${m}%"></i></div><span>${m}% dominado · ${idsOf(k).length} ejercicios</span></button>`};
    app.innerHTML=`<h1>Practicar</h1><p class="lead">Elige un tema.</p>
    <h2>Donde perdiste puntos</h2><div class="grid">${TOPICS.filter(k=>T[k].grp==='fallos').map(card).join('')}</div>
    <h2>Ya lo dominas: repaso para mantenerlo</h2><div class="grid">${TOPICS.filter(k=>T[k].grp==='repaso').map(card).join('')}</div>`;
    return;
  }
  app.innerHTML=`
  <button class="btn sec sm" onclick="practice()">← Temas</button>
  <h1>${T[t].e} ${T[t].n}</h1>
  <p class="lead">${T[t].d}</p>
  <div class="rulebox"><b>Spickzettel</b><br>${T[t].rule}</div>
  <div class="row" style="margin-top:14px">
    <button class="btn" onclick="start('topic','${t}')">Ejercicios (12)</button>
    <button class="btn sec" onclick="start('cards','${t}')">Tarjetas</button>
  </div>
  <h2>Tus errores en este tema</h2>
  ${ERR.filter(e=>e.topic===t).map(e=>`<div class="err"><div class="meta">${e.t} · ${e.s}</div><div class="wrong">✗ ${esc(e.my)}</div><div class="right">✓ ${esc(e.ok)}</div></div>`).join('')||'<p class="lead">Sin errores registrados.</p>'}`;
}

/* ============ MOTOR DE SESIONES ============ */
function start(mode,arg){
  stopTimer();window.scrollTo(0,0);
  let items=[],extra={};
  if(mode==='smart')items=pickWeighted(ITEMS,10);
  else if(mode==='spot')items=shuffle(ITEMS.filter(i=>i.spot)).slice(0,10);
  else if(mode==='topic')items=pickWeighted(ITEMS.filter(i=>i.topic===arg),12);
  else if(mode==='cards')items=shuffle(ITEMS.filter(i=>i.topic===arg&&i.type!=='order'&&!i.spot));
  else if(mode==='timer'){items=shuffle(ITEMS.filter(i=>i.type!=='order'));extra.endAt=Date.now()+90000}
  else if(mode==='exam'){
    TOPICS.forEach(t=>{const pool=shuffle(ITEMS.filter(i=>i.topic===t));items.push(...pool.slice(0,2))});
    items=shuffle(items);
  }
  items=items.map(clone);
  SS={mode,arg,items,i:0,ok:0,n:0,log:[],xp0:S.xp,...extra};
  renderNav(mode==='exam'?'sim':mode==='cards'||mode==='topic'?'practice':'home');
  if(mode==='timer'){timerId=setInterval(tick,250)}
  mode==='cards'?renderCard():renderQ();
}
function tick(){
  const left=Math.max(0,SS.endAt-Date.now());
  const el=$('#timer');if(el)el.textContent=(left/1000).toFixed(0)+' s';
  if(left<=0){stopTimer();finish()}
}
const modeName={smart:'Repaso inteligente',spot:'Caza el error',topic:'Ejercicios',timer:'Contrarreloj',exam:'Simulacro',cards:'Tarjetas'};

function renderQ(){
  const s=SS;
  if(s.done)return;
  if(s.mode!=='timer'&&s.i>=s.items.length)return finish();
  if(s.mode==='timer'&&s.i>=s.items.length){s.items=s.items.concat(shuffle(ITEMS.filter(i=>i.type!=='order')).map(clone))}
  const it=s.items[s.i];
  const total=s.mode==='timer'?'':'/ '+s.items.length;
  const head=`<div class="top2"><span>${modeName[s.mode]}${s.arg&&T[s.arg]?' · '+T[s.arg].n:''} · <b>${s.i+1}${total}</b>${it._retry?' · repetición':''}</span>${s.mode==='timer'?`<b id="timer" style="font-size:18px;color:var(--ink)"></b><span>${s.ok} ✓</span>`:`<span class="chip">${T[it.topic].n}</span>`}</div>`;
  let body='';
  const qh=it.q.replace('___','<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
  if(it.type==='fill'){
    body=`<div class="q">${qh}</div>
    <input class="txt" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Escribe aquí">
    <div class="uml">${['ä','ö','ü','ß'].map(c=>`<button onclick="ins('${c}')">${c}</button>`).join('')}</div>
    <button class="btn" id="chk" onclick="checkFill()">Comprobar</button>`;
  }else if(it.type==='choice'){
    if(!it._o)it._o=shuffle(it.opts.map((t,k)=>({t,ok:k===0})));
    body=`<div class="q">${qh}</div><div class="opts">${it._o.map((o,k)=>`<button class="opt" onclick="pick(${k})">${o.t}</button>`).join('')}</div>`;
  }else{
    if(!it._tiles){
      const raw=it.a.split(' ');
      const all=raw.map((w,k)=>{let t=w.replace(/[.,?!]+$/,'');if(k>0&&/[.?!]$/.test(raw[k-1])&&STARTW.has(t.toLowerCase()))t=t.toLowerCase();return {w:t,k}});
      it._lock=all[0];it._tiles=shuffle(all.slice(1));it._ans=[];
    }
    body=`<div class="q">${esc(it.q)}</div><div class="lead" style="font-size:13px;margin:-6px 0 10px">La primera palabra ya está puesta. Comas y puntos no cuentan.</div><div class="tiles ans" id="ans"></div><div class="tiles" id="bank"></div>
    <div class="row"><button class="btn" id="chk" onclick="checkOrder()">Comprobar</button><button class="btn sec" onclick="resetOrder()">Reiniciar</button></div>`;
  }
  app.innerHTML=head+`<div class="card" id="qcard">${body}<div id="fb"></div></div>`;
  if(it.type==='fill'){const inp=$('#inp');inp.focus();inp.addEventListener('keydown',e=>{if(e.key==='Enter')checkFill()})}
  if(it.type==='order')drawTiles();
  if(s.mode==='timer')tick();
}
function ins(c){const i=$('#inp');if(!i)return;const a=i.selectionStart,b=i.selectionEnd;i.value=i.value.slice(0,a)+c+i.value.slice(b);i.focus();i.setSelectionRange(a+1,a+1)}
function drawTiles(){
  const it=SS.items[SS.i];
  const used=new Set(it._ans.map(x=>x.k));
  $('#ans').innerHTML=`<span class="tile lock">${esc(it._lock.w)}</span>`+it._ans.map(x=>`<button class="tile" onclick="untile(${x.k})">${esc(x.w)}</button>`).join('');
  $('#bank').innerHTML=it._tiles.filter(x=>!used.has(x.k)).map(x=>`<button class="tile" onclick="tile(${x.k})">${esc(x.w)}</button>`).join('');
}
function tile(k){const it=SS.items[SS.i];if(it._done)return;it._ans.push(it._tiles.find(x=>x.k===k));drawTiles()}
function untile(k){const it=SS.items[SS.i];if(it._done)return;it._ans=it._ans.filter(x=>x.k!==k);drawTiles()}
function resetOrder(){const it=SS.items[SS.i];if(it._done)return;it._ans=[];drawTiles()}
function checkOrder(){
  const it=SS.items[SS.i];if(it._done||!it._ans.length)return;
  if(it._ans.length<it._tiles.length){$('#fb').innerHTML='<div class="fb bad">Usa todas las palabras antes de comprobar.</div>';return}
  const mine=[it._lock,...it._ans].map(x=>x.w).join(' ');
  const ok=[it.a,...it.alts].some(a=>keyOf(a)===keyOf(mine));
  resolve(ok,mine);
}
function checkFill(){
  const it=SS.items[SS.i];if(it._done)return;
  const v=$('#inp').value;if(!v.trim())return;
  resolve(it.a.some(a=>norm(a)===norm(v)),v);
}
function pick(k){
  const it=SS.items[SS.i];if(it._done)return;
  document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(it._o[j].ok)b.classList.add('ok');else if(j===k)b.classList.add('bad')});
  resolve(it._o[k].ok,it._o[k].t);
}
function shownAnswer(it){return it.type==='fill'?it.a[0]:it.type==='choice'?it.opts[0]:it.a}
function resolve(ok,given){
  const s=SS,it=s.items[s.i];it._done=true;
  if(!it._retry){s.n++;if(ok)s.ok++;s.log.push({it,ok,given});rec(it.id,ok)}
  if(s.mode==='timer'&&!ok)s.endAt-=5000;
  if(s.mode==='exam'){s.i++;return renderQ()}
  if(!ok&&!it._retry&&s.mode!=='timer'){const c=clone(it);c._retry=true;s.items.push(c)}
  const inp=$('#inp');if(inp)inp.disabled=true;
  const chk=$('#chk');if(chk)chk.style.display='none';
  const fb=`<div class="fb ${ok?'ok':'bad'}"><b>${ok?'¡Correcto!':'Todavía no.'}</b>${ok?'':`<div>Respuesta: <b>${esc(shownAnswer(it))}</b></div>`}<div class="why">${it.why||''}</div>${ok||!T[it.topic]?'':`<div class="rule"><b>Regla:</b> ${T[it.topic].rule.split('<br>')[0]}</div>`}</div>`;
  $('#fb').innerHTML=fb+(s.mode==='timer'?'':`<div class="row" style="margin-top:12px"><button class="btn" id="nx" onclick="next()">Siguiente →</button></div>`);
  if(s.mode==='timer'){setTimeout(()=>{if(SS===s){s.i++;renderQ()}},ok?700:1800)}
  else{const nx=$('#nx');nx&&nx.focus()}
}
function next(){SS.i++;renderQ()}

/* ============ TARJETAS ============ */
function renderCard(flip){
  const s=SS;
  if(s.i>=s.items.length)return finish();
  const it=s.items[s.i];
  const qh=it.q.replace('___','<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
  app.innerHTML=`<div class="top2"><span>Tarjetas · ${T[s.arg].n} · <b>${s.i+1} / ${s.items.length}</b></span></div>
  <div class="card flip" onclick="renderCard(true)">${flip?`<div class="q"><b>${esc(shownAnswer(it))}</b></div><div class="why">${it.why||''}</div>`:`<div class="q">${qh}</div><div class="lead">Toca para ver la respuesta</div>`}</div>
  ${flip?`<div class="row" style="margin-top:12px"><button class="btn" onclick="grade(true)">✓ Lo sabía</button><button class="btn sec" onclick="grade(false)">✗ A repasar</button></div>`:''}`;
}
function grade(ok){const s=SS,it=s.items[s.i];s.n++;if(ok)s.ok++;s.log.push({it,ok,given:''});rec(it.id,ok);s.i++;renderCard()}

/* ============ RESULTADOS ============ */
function finish(){
  stopTimer();
  const s=SS;if(!s)return;
  s.done=true;
  const pct=s.n?Math.round(100*s.ok/s.n):0;
  if(s.mode==='timer'&&s.ok>(S.best.timer||0)){S.best.timer=s.ok;save()}
  if(s.mode==='exam'){S.sims.push({d:today(),pct});S.sims=S.sims.slice(-20);save()}
  const wrong=s.log.filter(l=>!l.ok);
  const by={};s.log.forEach(l=>{const b=by[l.it.topic]||(by[l.it.topic]={ok:0,n:0});b.n++;if(l.ok)b.ok++});
  app.innerHTML=`<h1>${modeName[s.mode]}: resultado</h1>
  <div class="card" style="text-align:center">
    <div class="score">${s.mode==='timer'?s.ok:pct+'%'}</div>
    <p class="lead">${s.mode==='timer'?`aciertos en 90 s · récord ${S.best.timer||0}`:`${s.ok} de ${s.n} correctas`} · +${S.xp-s.xp0} XP</p>
    <div class="row" style="justify-content:center">
      <button class="btn" onclick="start('${s.mode}'${s.arg?`,'${s.arg}'`:''})">Otra vez</button>
      <button class="btn sec" onclick="go('home')">Inicio</button>
    </div>
  </div>
  ${s.mode==='exam'?`<h2>Por tema</h2><div class="card">${Object.keys(by).map(t=>`<div class="tr"><div class="h"><b>${T[t].e} ${T[t].n}</b><span class="chip">${by[t].ok}/${by[t].n}</span><button class="btn sm sec" onclick="practice('${t}')">Repasar</button></div></div>`).join('')}</div>`:''}
  ${wrong.length?`<h2>Para repasar (${wrong.length})</h2>${wrong.map(l=>`<div class="err"><div class="meta">${T[l.it.topic].n}</div><div style="margin-bottom:6px">${esc(l.it.q)}</div>${l.given?`<div class="wrong">✗ ${esc(l.given)}</div>`:''}<div class="right">✓ ${esc(shownAnswer(l.it))}</div><div class="why">${l.it.why||''}</div></div>`).join('')}`:''}`;
}

/* ============ SIMULACRO ============ */
function sim(){
  app.innerHTML=`<h1>Simulacro</h1><p class="lead">${TOPICS.length*2} ejercicios mezclados de los ${TOPICS.length} temas (2 por tema). Sin pistas ni correcciones hasta el final.</p>
  <div class="card"><button class="btn" onclick="start('exam')">Empezar simulacro</button>
  ${S.sims.length?`<h2>Historial</h2>${S.sims.slice().reverse().map(x=>`<div class="tr"><div class="h"><b>${x.d}</b><span class="chip">${x.pct}%</span></div><div class="bar"><i style="width:${x.pct}%"></i></div></div>`).join('')}`:''}</div>`;
}

/* ============ PROGRESO ============ */
function prog(){
  const weak=ITEMS.filter(i=>S.it[i.id]?.wrong).sort((a,b)=>S.it[b.id].wrong-S.it[a.id].wrong).slice(0,8);
  app.innerHTML=`<h1>Progreso</h1>
  <div class="card">${TOPICS.map(t=>{const m=Math.round(mastery(idsOf(t))*100);const seen=idsOf(t).filter(id=>S.it[id]).length;return `<div class="tr"><div class="h"><b>${T[t].e} ${T[t].n}</b><span class="chip">${seen}/${idsOf(t).length} vistos</span><span class="chip">${m}%</span></div><div class="bar"><i style="width:${m}%"></i></div></div>`}).join('')}</div>
  <h2>Lo que más fallas</h2>
  ${weak.length?weak.map(i=>`<div class="err"><div class="meta">${T[i.topic].n} · ${S.it[i.id].wrong} fallos</div><div>${esc(i.q)}</div><div class="right">✓ ${esc(shownAnswer(i))}</div></div>`).join(''):'<p class="lead">Aún sin fallos registrados.</p>'}
  <h2>Ajustes</h2>
  <div class="row"><button class="btn sec sm" onclick="toggleTheme()">Cambiar tema claro/oscuro</button><button class="btn sec sm" onclick="if(confirm('¿Borrar todo el progreso?')){localStorage.removeItem(KEY);location.reload()}">Borrar progreso</button></div>`;
}
function toggleTheme(){
  const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  const n=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=n;S.theme=n;save();
}
if(S.theme)document.documentElement.dataset.theme=S.theme;
go('home');
</script>
</body>
